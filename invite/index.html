<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation KOWO</title><meta name="theme-color" content="#0F3D2E"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f7f8f4;color:#0f3d2e}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:520px;background:white;border:1px solid rgba(15,61,46,.09);border-radius:30px;padding:32px;box-shadow:0 24px 70px rgba(15,61,46,.12);text-align:center}.logo{width:76px;height:76px;border-radius:22px;object-fit:cover}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#4d8d68;font-weight:700;margin-top:18px}.title{font-size:30px;margin:8px 0}.sub{color:#637069;line-height:1.6}.code{display:inline-block;background:#eaf7ee;border-radius:999px;padding:10px 16px;font-weight:700;margin:12px}.btn{display:block;text-decoration:none;border-radius:16px;padding:15px 18px;margin-top:12px;font-weight:700}.primary{background:#0f3d2e;color:#fff}.secondary{border:1px solid #0f3d2e;color:#0f3d2e}.note{font-size:12px;color:#77817c;margin-top:18px}</style></head><body><main class="wrap"><section class="card"><img class="logo" src="/assets/kowo-logo-icon.jpg" alt="KOWO"><div class="eyebrow">INVITATION KOWO</div><h1 class="title">Rejoins ton groupe sur KOWO</h1><p class="sub">Ouvre l’application pour consulter le groupe et envoyer ta demande d’adhésion.</p><div class="code" id="code">Code indisponible</div><a id="open" class="btn primary" href="#">Ouvrir dans KOWO</a><a id="store" class="btn secondary" href="#">Télécharger ou mettre à jour KOWO</a><p class="note">Après l’installation, reviens sur ce lien puis touche « Ouvrir dans KOWO ».</p></section></main><script>
const p=new URLSearchParams(location.search);const fromPath=location.pathname.match(/\/invite\/([^/]+)/i);const code=(p.get('code')||(fromPath&&fromPath[1])||'').toUpperCase();document.getElementById('code').textContent=code||'Code indisponible';
const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);const android=/Android/.test(navigator.userAgent);const store=ios?'https://apps.apple.com/fr/app/kowo/id6777103160':android?'https://play.google.com/store/apps/details?id=com.kowo.app':'https://getkowo.com';
const deep='kowo://invite/'+encodeURIComponent(code);document.getElementById('open').href=deep;document.getElementById('store').href=store;
if(code){setTimeout(()=>{location.href=deep},150)}
</script></body></html>
